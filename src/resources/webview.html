<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-${nonce}' ${cspSource}; style-src ${cspSource} 'unsafe-inline'; img-src ${cspSource} data: blob:; connect-src ${cspSource} data: blob:; font-src ${cspSource};"
    />
    <title>WMF/EMF Viewer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        color: #333;
      }
      .container {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow: hidden;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid #e8e8e8;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        font-weight: 600;
        color: #1976d2;
        white-space: nowrap;
      }
      .title::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1976d2;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: flex-end;
      }
      .toolbar-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar-divider {
        width: 1px;
        height: 24px;
        background: #e0e0e0;
        flex-shrink: 0;
      }
      button {
        height: 32px;
        padding: 0 14px;
        background-color: #1976d2;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition:
          background-color 0.15s ease,
          transform 0.1s ease,
          box-shadow 0.15s ease;
      }
      button:hover {
        background-color: #1565c0;
        box-shadow: 0 2px 6px rgba(25, 118, 210, 0.25);
      }
      button:active {
        transform: translateY(1px);
      }
      button:focus-visible,
      select:focus-visible,
      .debug-toggle:focus-within {
        outline: 2px solid #90caf9;
        outline-offset: 1px;
      }
      select {
        height: 32px;
        padding: 0 8px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background-color: #fff;
        font-size: 13px;
        color: #333;
        cursor: pointer;
        transition: border-color 0.15s ease;
      }
      select:hover {
        border-color: #1976d2;
      }
      select:focus {
        outline: none;
        border-color: #1976d2;
      }
      .debug-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        background: #fafafa;
        font-size: 13px;
        color: #555;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      .debug-toggle:hover {
        border-color: #1976d2;
        background: #f0f7ff;
      }
      .debug-toggle input {
        cursor: pointer;
        accent-color: #1976d2;
      }
      .canvas-section {
        flex: 1;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .canvas-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        background-color: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 20px;
      }
      canvas {
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 2px;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        object-fit: contain;
      }
      #svgContainer {
        display: none;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
        overflow: auto;
        background-color: white;
        border: 1px solid #e0e0e0;
        border-radius: 2px;
      }
      #svgContainer svg {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
      }
      .canvas-info {
        margin-top: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        color: #666;
      }
      .status-bar {
        margin-top: 15px;
        display: flex;
        gap: 15px;
        align-items: center;
        font-size: 12px;
      }
      .status-item {
        padding: 6px 12px;
        background-color: #f5f5f5;
        border-radius: 12px;
        color: #666;
        font-weight: 500;
      }
      .sidebar {
        width: 350px;
        background-color: white;
        border-left: 1px solid #e0e0e0;
        display: flex;
        flex-direction: column;
        box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
      }
      .sidebar-header {
        padding: 16px 20px;
        border-bottom: 1px solid #e0e0e0;
        background-color: #f9f9f9;
        font-weight: 600;
        font-size: 14px;
        color: #333;
      }
      .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 10px 0;
      }
      .records-list {
        flex: 1;
        overflow-y: auto;
      }
      .record-item {
        padding: 10px 20px;
        border-bottom: 1px solid #f0f0f0;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        color: #333;
      }
      .record-item:hover {
        background-color: #f5f5f5;
        padding-left: 24px;
      }
      .record-item.selected {
        background-color: #e3f2fd;
        color: #1976d2;
        font-weight: 500;
        border-left: 3px solid #1976d2;
        padding-left: 17px;
      }
      .debug {
        background-color: #2d2d2d;
        color: #e0e0e0;
        padding: 12px;
        margin-top: 10px;
        border-radius: 4px;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        white-space: pre-wrap;
        max-height: 120px;
        overflow-y: auto;
        font-size: 12px;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      }
      .section-title {
        font-size: 12px;
        font-weight: 600;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 15px 20px 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="main-content">
        <div class="header">
          <div class="title">WMF/EMF Viewer</div>
          <div class="toolbar">
            <div class="toolbar-group">
              <select id="renderMode" title="选择渲染器">
                <option value="canvas">Canvas 渲染</option>
                <option value="svg">SVG 渲染</option>
              </select>
              <label class="debug-toggle" title="显示/隐藏指令列表和调试日志">
                <input type="checkbox" id="debugToggle" />
                调试信息
              </label>
            </div>
            <div class="toolbar-divider"></div>
            <div class="toolbar-group">
              <button id="exportPngBtn" title="导出为PNG">PNG</button>
              <button id="exportPdfBtn" title="导出为PDF">PDF</button>
              <button id="exportSvgBtn" title="导出为SVG">SVG</button>
            </div>
          </div>
        </div>
        <div class="canvas-section">
          <div class="canvas-wrapper">
            <canvas id="wmfCanvas"></canvas>
            <div id="svgContainer"></div>
          </div>
          <div class="canvas-info">
            <div class="status-bar">
              <span id="canvasInfo" class="status-item"></span>
              <span id="fileTypeInfo" class="status-item"></span>
              <span id="recordsCountInfo" class="status-item"></span>
              <span id="fileSizeInfo" class="status-item"></span>
              <span id="parseTimeInfo" class="status-item"></span>
            </div>
          </div>
        </div>
        <div id="debug" class="debug"></div>
      </div>
      <div class="sidebar">
        <div class="sidebar-header">指令列表</div>
        <div class="sidebar-content">
          <div class="records-list" id="recordsList"></div>
        </div>
      </div>
    </div>
    <script nonce="${nonce}" src="metafileParser.browser.js"></script>
    <script nonce="${nonce}">
      // 调试信息是否可见（默认关闭：隐藏指令列表和日志，只显示渲染画面）
      let debugInfoVisible = false;

      // 待构建的指令列表（延迟到调试模式开启时才渲染 DOM）
      let pendingRecords = null;

      // 根据开关状态控制指令列表与日志面板的显示
      function updateDebugVisibility() {
        const sidebar = document.querySelector(".sidebar");
        const debugEl = document.getElementById("debug");
        sidebar.style.display = debugInfoVisible ? "flex" : "none";
        debugEl.style.display =
          debugInfoVisible && debugEl.textContent ? "block" : "none";
        // 性能：指令列表默认隐藏，延迟到调试模式开启时才构建 DOM
        if (debugInfoVisible && pendingRecords) {
          const records = pendingRecords;
          pendingRecords = null;
          showRecordsList(records);
        }
      }

      // 显示调试信息
      function showDebug(message) {
        const debugDiv = document.getElementById("debug");
        debugDiv.textContent += message + "\n";
        if (debugInfoVisible) {
          debugDiv.style.display = "block";
        }
      }

      // 检查脚本是否加载
      showDebug("Script loaded, checking global objects...");
      showDebug("typeof MetafileParser: " + typeof MetafileParser);
      showDebug(
        "typeof window.MetafileParser: " + typeof window.MetafileParser,
      );
      showDebug("typeof WmfDrawer: " + typeof WmfDrawer);
      showDebug(
        "window keys: " +
          Object.keys(window)
            .filter((k) => k.includes("Parser") || k.includes("Drawer"))
            .join(", "),
      );

      // 导出为PNG
      function exportToPNG() {
        const canvas = document.getElementById("wmfCanvas");
        try {
          // 若当前为SVG渲染模式且Canvas尚未绘制，先补绘Canvas
          if (!canvasRendered && currentRenderResult) {
            renderCanvas();
          }
          // 创建下载链接
          const link = document.createElement("a");
          link.download = "metafile-export.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        } catch (error) {
          console.error("Error exporting PNG:", error);
          showDebug("导出PNG时出错: " + error.message);
        }
      }

      // 原始字节缓存：仅当解析结果缺失（如导出前尚未解析）时才重新解析
      let currentBytes = null;

      // 渲染器切换相关状态
      let currentRenderResult = null; // 解析结果（两种渲染器共用）
      let currentRenderFileType = null;
      let canvasRendered = false;

      // 根据文件类型创建对应的绘制器
      function createDrawer(context, fileType) {
        if (fileType === "wmf" || fileType === "placeable-wmf") {
          return new WmfDrawer(context);
        } else if (fileType === "emf") {
          return new EmfDrawer(context);
        } else if (fileType === "emf+") {
          return new EmfPlusDrawer(context);
        }
        throw new Error("Unknown file type: " + fileType);
      }

      // 使用 Canvas 2D 渲染
      function renderCanvas() {
        const canvas = document.getElementById("wmfCanvas");
        const ctx = canvas.getContext("2d");
        const canvasWrapper = document.querySelector(".canvas-wrapper");
        const viewWidth = canvasWrapper.clientWidth;
        const viewHeight = canvasWrapper.clientHeight;

        const drawer = createDrawer(ctx, currentRenderFileType);
        drawer.draw(currentRenderResult, { viewWidth, viewHeight });
        canvasRendered = true;

        // 检查是否有实际内容
        // 性能：getImageData 是 GPU→CPU 同步回读，仅在调试信息可见时执行
        try {
          if (debugInfoVisible) {
            const imageData = ctx.getImageData(
              0,
              0,
              Math.min(canvas.width, 100),
              Math.min(canvas.height, 100),
            );
            const data = imageData.data;
            let nonWhitePixels = 0;
            for (let i = 0; i < data.length; i += 4) {
              if (data[i] !== 255 || data[i + 1] !== 255 || data[i + 2] !== 255) {
                nonWhitePixels++;
              }
            }
            showDebug("Non-white pixels in sample area: " + nonWhitePixels);
          }
        } catch (error) {
          showDebug("内容检查失败: " + error.message);
        }

        document.getElementById("canvasInfo").textContent =
          `尺寸: ${canvas.width} x ${canvas.height}`;
      }

      // 使用 SVG 渲染
      function renderSVG() {
        const svgCtx = new SvgContext();
        const canvasWrapper = document.querySelector(".canvas-wrapper");
        const viewWidth = canvasWrapper.clientWidth;
        const viewHeight = canvasWrapper.clientHeight;

        const drawer = createDrawer(svgCtx, currentRenderFileType);
        drawer.draw(currentRenderResult, { viewWidth, viewHeight });

        // innerHTML 无法解析 XML 声明，注入前移除首行
        const svgText = svgCtx.getSvg().replace(/^<\?xml[^>]*>\s*/, "");
        document.getElementById("svgContainer").innerHTML = svgText;

        document.getElementById("canvasInfo").textContent =
          `尺寸: ${svgCtx.canvas.width} x ${svgCtx.canvas.height}` +
          ` (SVG, ${svgCtx._nodes.length} 个元素)`;
      }

      // 按当前选择的渲染器渲染
      function renderPreview() {
        if (!currentRenderResult) return;
        const mode = document.getElementById("renderMode").value;
        const canvas = document.getElementById("wmfCanvas");
        const svgContainer = document.getElementById("svgContainer");

        if (mode === "svg") {
          renderSVG();
          canvas.style.display = "none";
          svgContainer.style.display = "flex";
        } else {
          renderCanvas();
          canvas.style.display = "block";
          svgContainer.style.display = "none";
        }
      }

      // 获取用于渲染/导出的解析结果
      // 性能：优先复用预览阶段已解析的结果，避免重复解码与解析大文件
      function getRenderData() {
        if (currentRenderResult && currentRenderFileType) {
          return {
            result: currentRenderResult,
            fileType: currentRenderFileType,
          };
        }
        if (!currentBytes) {
          return { result: null, fileType: null };
        }
        const parser = new MetafileParser(currentBytes);
        const result = parser.parse();
        if (result.error) {
          throw new Error(result.error);
        }
        return { result, fileType: parser.fileType };
      }

      // 按文件类型创建对应的绘制器（导出用）
      function createExportDrawer(ctx, fileType) {
        if (fileType === "wmf" || fileType === "placeable-wmf") {
          return new WmfDrawer(ctx);
        } else if (fileType === "emf") {
          return new EmfDrawer(ctx);
        } else if (fileType === "emf+") {
          return new EmfPlusDrawer(ctx);
        }
        throw new Error("Unknown file type: " + fileType);
      }

      // 导出为PDF（矢量，使用绘制指令生成）
      function exportToPDF() {
        try {
          const { result, fileType } = getRenderData();
          if (!result) {
            throw new Error("没有可用的源数据，无法导出PDF");
          }

          const pdfCtx = new PdfContext();
          const drawer = createExportDrawer(pdfCtx, fileType);
          drawer.draw(result);

          const pdfBytes = pdfCtx.buildPdf();
          const blob = new Blob([pdfBytes], { type: "application/pdf" });
          const link = document.createElement("a");
          link.download = "metafile-export.pdf";
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);
        } catch (error) {
          console.error("Error exporting PDF:", error);
          showDebug("导出PDF时出错: " + error.message);
        }
      }

      // 导出为SVG（矢量，复用SvgContext把绘制指令转为SVG元素）
      function exportToSVG() {
        try {
          const { result, fileType } = getRenderData();
          if (!result) {
            throw new Error("没有可用的源数据，无法导出SVG");
          }

          if (typeof SvgContext === "undefined") {
            throw new Error(
              "SvgContext is not defined. The browser bundle may not include it.",
            );
          }

          const svgCtx = new SvgContext();
          const drawer = createExportDrawer(svgCtx, fileType);
          drawer.draw(result);

          const svgText = svgCtx.getSvg();
          const blob = new Blob([svgText], { type: "image/svg+xml" });
          const link = document.createElement("a");
          link.download = "metafile-export.svg";
          link.href = URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);

          showDebug(
            "SVG导出完成: " +
              svgText.length / 1024 +
              " KB (" +
              svgCtx._nodes.length +
              " 个元素)",
          );
        } catch (error) {
          console.error("Error exporting SVG:", error);
          showDebug("导出SVG时出错: " + error.message);
        }
      }

      // 格式化参数为友好的字符串
      function formatParams(params) {
        if (typeof params !== "object" || params === null) {
          return String(params);
        }

        // 处理数组
        if (Array.isArray(params)) {
          if (params.length === 0) {
            return "[]";
          }
          // 检查是否是坐标点数组
          if (params.every((item) => typeof item === "number")) {
            if (params.length === 2) {
              return `(${params[0]}, ${params[1]})`;
            } else if (params.length === 4) {
              return `(${params[0]}, ${params[1]}) - (${params[2]}, ${params[3]})`;
            }
          }
          return "[" + params.map((p) => formatParams(p)).join(", ") + "]";
        }

        // 处理对象
        const keys = Object.keys(params);
        if (keys.length === 0) {
          return "{}";
        }

        // 特殊处理常见参数结构
        if (keys.includes("x") && keys.includes("y")) {
          return `(${params.x}, ${params.y})`;
        }
        if (
          keys.includes("left") &&
          keys.includes("top") &&
          keys.includes("right") &&
          keys.includes("bottom")
        ) {
          return `(${params.left}, ${params.top}) - (${params.right}, ${params.bottom})`;
        }

        // 一般对象
        const formatted = keys.map((key) => {
          const value = formatParams(params[key]);
          return `${key}: ${value}`;
        });

        // 限制显示长度
        const result = "{" + formatted.join(", ") + "}";
        return result.length > 100 ? result.substring(0, 97) + "..." : result;
      }

      // 从原始数据中提取有用信息
      function formatData(data, typeName) {
        if (!data || data.length === 0) {
          return "[无数据]";
        }

        // 处理不同类型的指令数据
        switch (typeName) {
          case "META_MOVETO":
          case "META_LINETO":
            if (data.length >= 4) {
              const x = ((data[0] | (data[1] << 8)) << 16) >> 16; // 有符号16位
              const y = ((data[2] | (data[3] << 8)) << 16) >> 16; // 有符号16位
              return `(${x}, ${y})`;
            }
            break;
          case "META_RECTANGLE":
          case "META_ELLIPSE":
            if (data.length >= 8) {
              const left = ((data[0] | (data[1] << 8)) << 16) >> 16;
              const top = ((data[2] | (data[3] << 8)) << 16) >> 16;
              const right = ((data[4] | (data[5] << 8)) << 16) >> 16;
              const bottom = ((data[6] | (data[7] << 8)) << 16) >> 16;
              return `(${left}, ${top}) - (${right}, ${bottom})`;
            }
            break;
          case "META_SETBKCOLOR":
          case "META_SETTEXTCOLOR":
            if (data.length >= 4) {
              const color =
                data[0] | (data[1] << 8) | (data[2] << 16) | (data[3] << 24);
              return `0x${color.toString(16).padStart(8, "0")}`;
            }
            break;
          case "META_SELECTOBJECT":
            if (data.length >= 2) {
              const objectIndex = data[0] | (data[1] << 8);
              return `对象索引: ${objectIndex}`;
            }
            break;
          case "META_CREATEPENINDIRECT":
          case "META_CREATEBRUSHINDIRECT":
            return `[复杂参数]`;
          case "META_TEXTOUT":
            // META_TEXTOUT 结构: 16位x, 16位y, 16位选项, 16位长度, 文本数据
            if (data.length >= 8) {
              const x = ((data[0] | (data[1] << 8)) << 16) >> 16;
              const y = ((data[2] | (data[3] << 8)) << 16) >> 16;
              const length = data[6] | (data[7] << 8);
              if (data.length >= 8 + length) {
                try {
                  // 尝试将文本数据转换为字符串
                  const textData = data.slice(8, 8 + length);
                  const text = new TextDecoder("ascii").decode(textData);
                  return `(${x}, ${y}) "${text}"`;
                } catch (e) {
                  return `(${x}, ${y}) [文本数据]`;
                }
              }
            }
            return `[文本数据]`;
          case "META_EXTTEXTOUT":
            // META_EXTTEXTOUT 结构: 保留字节(2) + 选项(2) + 边界RECT(8) + 字符串长度(2) + 文本数据
            if (data.length >= 14) {
              const length = data[12] | (data[13] << 8);
              if (length > 0 && data.length >= 14 + length) {
                try {
                  const text = new TextDecoder("ascii")
                    .decode(data.slice(14, 14 + length))
                    .replace(/\0/g, "")
                    .replace(/[\x00-\x1F]/g, "");
                  if (text.length > 0) {
                    return `"${text}"`;
                  }
                } catch (e) {
                  return `[文本数据]`;
                }
              }
            }
            return `[文本数据]`;
          case "EMR_EXTTEXTOUTA":
            // EMR_EXTTEXTOUTA 结构: 各种参数后跟ASCII文本
            if (data.length >= 40) {
              // 跳过前面的参数，找到文本数据
              // 实际结构复杂，这里简单处理
              try {
                // 从偏移量40开始尝试解析文本
                const textData = data.slice(40);
                const text = new TextDecoder("ascii")
                  .decode(textData)
                  .replace(/\0/g, "");
                if (text.length > 0) {
                  return `"${text}"`;
                }
              } catch (e) {
                return `[文本数据]`;
              }
            }
            return `[文本数据]`;
          case "EMR_EXTTEXTOUTW":
            // EMR_EXTTEXTOUTW 结构: 各种参数后跟Unicode文本
            if (data.length >= 40) {
              // 跳过前面的参数，找到文本数据
              try {
                // 从偏移量40开始尝试解析Unicode文本
                const textData = data.slice(40);
                const text = new TextDecoder("utf-16le")
                  .decode(textData)
                  .replace(/\0/g, "");
                if (text.length > 0) {
                  return `"${text}"`;
                }
              } catch (e) {
                return `[文本数据]`;
              }
            }
            return `[文本数据]`;
          case "EmfPlusDrawString":
            // EmfPlusDrawString 结构: 包含文本数据
            if (data.length >= 24) {
              try {
                // 跳过前面的参数，找到文本数据
                const textData = data.slice(24);
                const text = new TextDecoder("utf-16le")
                  .decode(textData)
                  .replace(/\0/g, "");
                if (text.length > 0) {
                  return `"${text}"`;
                }
              } catch (e) {
                return `[文本数据]`;
              }
            }
            return `[文本数据]`;
        }

        // 对于其他类型，显示通用参数信息
        return `[参数]`;
      }

      // 显示指令列表
      // 性能：大文件记录数上千，用 DocumentFragment 批量插入 +
      // 容器级事件委托（避免每条记录一个监听器）
      function showRecordsList(records) {
        const recordsList = document.getElementById("recordsList");
        recordsList.innerHTML = "";

        const fragment = document.createDocumentFragment();
        records.forEach((record, index) => {
          const recordItem = document.createElement("div");
          recordItem.className = "record-item";

          // 确定记录类型名称
          let typeName = "Unknown";
          if (record.type) {
            if (record.typeName) {
              typeName = record.typeName;
            } else if (typeof record.type === "number") {
              // 对于没有typeName的记录，显示十六进制类型值
              typeName = "0x" + record.type.toString(16).padStart(4, "0");
            } else {
              typeName = record.type;
            }
          } else if (record.function) {
            typeName = record.function;
          } else if (record.functionId) {
            typeName =
              record.type ||
              "0x" + record.functionId.toString(16).padStart(4, "0");
          }

          // 添加额外信息
          let extraInfo = "";
          if (record.flags) {
            extraInfo += ` (flags: 0x${record.flags.toString(16).padStart(4, "0")})`;
          }

          // 添加参数信息
          let paramsInfo = "";
          if (record.params) {
            try {
              // 格式化参数为友好的字符串
              paramsInfo = " - " + formatParams(record.params);
            } catch (e) {
              // 解析错误时不显示参数
            }
          } else if (record.data && record.data.length > 0) {
            try {
              // 尝试从data中提取有用信息
              const dataInfo = formatData(record.data, typeName);
              // 只有在提取到有意义的参数信息时才显示
              if (dataInfo && dataInfo !== "[参数]") {
                paramsInfo = " - " + dataInfo;
              }
            } catch (e) {
              // 解析错误时不显示参数
            }
          }

          recordItem.textContent = `[${index}] ${typeName}${extraInfo}${paramsInfo}`;
          fragment.appendChild(recordItem);
        });
        recordsList.appendChild(fragment);
      }

      // 事件委托：点击选中记录项
      document.getElementById("recordsList").addEventListener("click", (e) => {
        const item = e.target.closest(".record-item");
        if (!item) return;
        document.querySelectorAll(".record-item.selected").forEach((el) => {
          el.classList.remove("selected");
        });
        item.classList.add("selected");
      });

      // 读取元文件字节
      // 主路径：扩展侧通过 asWebviewUri 传入文件 URI，这里 fetch 成 ArrayBuffer，
      // 不再把整份 base64 内联进 HTML（会膨胀 33% 并以字符串字面量常驻内存，
      // 17MB 文件曾产生 22MB 的 HTML）。
      // 回退路径：非 file: scheme（git: / vscode-vfs: 等）由扩展侧内联 base64。
      async function readMetafileBytes(fileUri, inlineBase64) {
        if (fileUri) {
          const response = await fetch(fileUri);
          if (!response.ok) {
            throw new Error(
              `读取文件失败: ${response.status} ${response.statusText}`,
            );
          }
          return new Uint8Array(await response.arrayBuffer());
        }
        if (!inlineBase64) {
          throw new Error("没有可预览的数据源");
        }
        const binaryString = atob(inlineBase64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes;
      }

      async function previewMetafile(fileUri, inlineBase64) {
        try {
          const fetchStart = performance.now();
          const bytes = await readMetafileBytes(fileUri, inlineBase64);
          currentBytes = bytes;
          const fetchTime = (performance.now() - fetchStart).toFixed(2);

          // 记录解析开始时间
          const startTime = performance.now();

          // 计算文件大小
          const fileSizeBytes = bytes.length;
          const fileSizeKB = (fileSizeBytes / 1024).toFixed(2);

          showDebug("Binary data length: " + bytes.length);
          showDebug("File size: " + fileSizeKB + " KB (fetch " + fetchTime + " ms)");
          showDebug("Creating parser...");

          // 检查 MetafileParser 是否存在
          if (typeof MetafileParser === "undefined") {
            throw new Error(
              "MetafileParser is not defined. The browser bundle may not have loaded correctly.",
            );
          }

          // 创建解析器实例
          const parser = new MetafileParser(bytes);
          showDebug("Parser created, starting parsing...");

          // 解析WMF文件
          const result = parser.parse();

          // 计算解析时间
          const endTime = performance.now();
          const parseTime = (endTime - startTime).toFixed(2);

          showDebug("Parsing completed.");
          showDebug("Parse time: " + parseTime + " ms");
          showDebug("File type: " + parser.fileType);
          showDebug("Records count: " + result.records.length);

          // 检查是否有错误
          if (result.error) {
            throw new Error(result.error);
          }

          // 存储解析结果，两种渲染器共用
          currentRenderResult = result;
          currentRenderFileType = parser.fileType;
          canvasRendered = false;

          // 更新文件信息
          document.getElementById("fileTypeInfo").textContent =
            `文件类型: ${parser.fileType}`;
          document.getElementById("recordsCountInfo").textContent =
            `记录数: ${result.records.length}`;
          document.getElementById("fileSizeInfo").textContent =
            `文件大小: ${fileSizeKB} KB`;
          document.getElementById("parseTimeInfo").textContent =
            `解析时间: ${parseTime} ms`;

          // 显示指令列表
          // 性能：仅暂存记录，调试侧栏默认隐藏，开启时才构建 DOM
          pendingRecords = result.records;
          updateDebugVisibility();

          // 按当前选择的渲染器渲染
          renderPreview();

          showDebug("Rendering completed.");
        } catch (error) {
          console.error("Error in preview:", error);
          showDebug("Error: " + error.message + "\nStack: " + error.stack);
        }
      }

      // 绑定事件
      document
        .getElementById("renderMode")
        .addEventListener("change", renderPreview);
      document
        .getElementById("debugToggle")
        .addEventListener("change", function () {
          debugInfoVisible = this.checked;
          // 联动解析器/绘制器的日志门控（bundle 默认静默以提升性能）
          globalThis.__WMF_DEBUG__ = debugInfoVisible;
          updateDebugVisibility();
        });
      document
        .getElementById("exportPngBtn")
        .addEventListener("click", exportToPNG);
      document
        .getElementById("exportPdfBtn")
        .addEventListener("click", exportToPDF);
      document
        .getElementById("exportSvgBtn")
        .addEventListener("click", exportToSVG);

      // 默认隐藏调试信息（开关默认关闭）
      updateDebugVisibility();

      // 窗口/面板尺寸变化后重绘（防抖）
      // canvas 仅靠 CSS max-width 缩放会得到拉伸模糊的位图，必须按新视口重新绘制
      let resizeTimer = null;
      const canvasWrapperEl = document.querySelector(".canvas-wrapper");
      if (typeof ResizeObserver !== "undefined" && canvasWrapperEl) {
        new ResizeObserver(() => {
          if (!currentRenderResult) return;
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(renderPreview, 150);
        }).observe(canvasWrapperEl);
      }

      // 执行预览（数据由扩展侧以 URI 形式注入；非 file: 资源回退到内联 base64）
      showDebug("Starting metafile preview...");
      previewMetafile("${metafileUri}", "${wmfBase64}").catch((error) => {
        console.error("Error in preview:", error);
        showDebug("Error: " + error.message + "\nStack: " + error.stack);
      });
    </script>
  </body>
</html>
