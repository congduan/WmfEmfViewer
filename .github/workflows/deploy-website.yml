name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - 'src/modules/**'
      - 'src/utils/**'
      - 'src/build/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The build script only uses Node built-ins (fs/path) — no npm install needed
      - name: Build browser bundle
        run: node src/build/build-browser-bundle.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages with "GitHub Actions" as the source
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
